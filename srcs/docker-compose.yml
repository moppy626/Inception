services:
  mariadb:
    container_name: mariadb
    image: mariadb:inception
    build: requirements/mariadb/.
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    env_file:
      - .env
    networks:
      - inception
    secrets:
      - db_password
      - db_root_password
  
  wordpress:
    container_name: wordpress
    image: wordpress:inception
    depends_on:
      - mariadb
    build: requirements/wordpress/.
    env_file:
      - .env
    volumes:
      - wp_data:/var/www/html
    restart: always
    networks:
      - inception
    secrets:
      - db_password
      - credentials
      - db_root_password

  nginx:
    container_name: nginx
    image: nginx:inception
    depends_on:
      - wordpress
    build: requirements/nginx/.
    env_file:
      - .env
    ports:
          - "443:443"
    volumes:
      - wp_data:/var/www/html
    restart: always
    networks:
      - inception

networks:
  inception:
    name: inception

volumes:
  db_data:
       driver_opts:
         type:   none
         o:      bind
         device: "/home/mmachida/data/db_data"
  wp_data:
       driver_opts:
         type:   none
         o:      bind
         device: "/home/mmachida/data/wp_data"
secrets:
  credentials:
    file: ../secrets/credentials.txt
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
