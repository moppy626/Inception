services:
  mariadb:
    container_name: mariadb
    image: mariadb
    build: requirements/mariadb/.
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    env_file:
      - .env
      - ../secrets/db_password.txt
      - ../secrets/db_root_password.txt
    networks:
      - inception
  
  wordpress:
    container_name: wordpress
    image: wordpress
    depends_on:
      - mariadb
    build: requirements/wordpress/.
    env_file:
      - .env
      - ../secrets/db_password.txt
      - ../secrets/credentials.txt
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception

  nginx:
    container_name: nginx
    image: nginx
    depends_on:
      - wordpress
    build: requirements/nginx/.
    env_file:
      - .env
    ports:
          - "80:80"
          - "443:443"
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception

networks:
  inception:

volumes:
  db_data:
      # driver_opts:
      #   type:   none
      #   o:      bind
      #   device: "/home/mmachida/data/db_data"
  wp_data:
      # driver_opts:
      #   type:   none
      #   o:      bind
      #   device: "/home/mmachida/data/wp_data"