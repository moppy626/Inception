# version: "3.8"

services:
  mariadb:
    image: mariadb:latest
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: examplepassword
      MARIADB_DATABASE: wordpress
      MARIADB_USER: user
      MARIADB_PASSWORD: examplepassword
  
  wordpress:
    depends_on:
      - mariadb
    build: requirements/wordpress/.
    volumes:
      - ./requirements/wordpress/www.conf:/etc/php/8.4/fpm/pool.d/www.conf
      - wp_data:/var/www/html
    restart: always
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: user
      WORDPRESS_DB_PASSWORD: examplepassword
      WORDPRESS_DB_NAME: wordpress

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./requirements/nginx/nginx.conf:/etc/nginx/nginx.conf
      - wp_data:/var/www/html
    depends_on:
      - wordpress

volumes:
  db_data:
  wp_data:
